# Personal overrides on top of Omarchy's ghostty config.
#
# ~/.config/ghostty/config stays a real file owned by Omarchy: `omarchy font
# set` and `omarchy display text size` rewrite it with `sed -i`, and the theme
# switcher includes its palette from there. install.sh appends a
# `config-file = ?user.conf` line to it so this file loads last and wins.

window-padding-x = 8
window-padding-y = 4

keybind = ctrl+delete=text:\e[3;5~
