# exec-once = ~/.config/hypr/hyprland/scripts/xdg-portal-hyprland.sh
# Respawn waybar if it dies (it still segfaults occasionally upstream).
# The sleep keeps a broken config from spinning in a tight loop.
exec-once = bash -c 'while :; do waybar; sleep 2; done'
exec-once = hyprpaper
exec-once = hypridle
exec-once = swaync
exec-once = fcitx5 -d

