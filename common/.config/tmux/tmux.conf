# ──────────────────────────────────────────────────────────────────────────────
# dotfiles · tmux.conf
# ANSI theme · Ctrl+a prefix · vim-tmux-navigator · sessionizer · TPM
# ──────────────────────────────────────────────────────────────────────────────

# ──── TPM bootstrap (auto-clone on first launch, mirrors zinit pattern) ────
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# ──── Server / session options ────
set  -g  default-terminal     "tmux-256color"
set  -ag terminal-overrides   ",xterm-256color:RGB,ghostty:RGB,xterm-ghostty:RGB"
set  -g  escape-time          0
set  -g  history-limit        50000
set  -g  focus-events         on
set  -g  mouse                on
set  -g  base-index           1
setw -g  pane-base-index      1
set  -g  renumber-windows     on
set  -g  set-clipboard        on
set  -g  status-keys          emacs
setw -g  mode-keys            vi
set  -g  allow-passthrough    on

# Pass modified keys through as CSI-u so TUIs (Claude Code, nvim) can tell
# Shift+Enter from Enter; Omarchy's ghostty sends it that way. -q: tmux < 3.5
# has no extended-keys-format.
set  -g  extended-keys        on
set  -gq extended-keys-format csi-u
set  -as terminal-features    ",xterm-ghostty:extkeys"

# ──── Prefix: Ctrl+a ────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ──── Splits: | and -, both inherit CWD ────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# ──── Reload ────
bind r source-file ~/.config/tmux/tmux.conf \; display-message " ~/.config/tmux/tmux.conf reloaded"

# ──── Copy mode (vi-style, system clipboard: pbcopy on macOS, wl-copy elsewhere) ────
if-shell 'uname | grep -q Darwin' \
  'set -s copy-command "pbcopy"' \
  'set -s copy-command "wl-copy"'
bind-key -T copy-mode-vi v        send-keys -X begin-selection
bind-key -T copy-mode-vi C-v      send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y        send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

# ──── vim-tmux-navigator (Ctrl+h/j/k/l/\ pass through to nvim) ────
# Mirrors keys defined in .config/nvim/lua/plugins/tmux.lua
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ──── Window movement / ergonomics ────
bind -r H swap-window -t -1 \; previous-window
bind -r L swap-window -t +1 \; next-window
bind Tab last-window

# ──── Sessionizer (popup fzf jump) ────
bind f display-popup -E -w 60% -h 50% "tmux-sessionizer"

# ──── Popups: lazygit (g) and scratch shell (G) ────
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind G display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# ──── Plugins (TPM) ────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'

# ──── Resurrect / Continuum ────
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim         'session'
set -g @continuum-restore               'on'
set -g @continuum-save-interval         '15'

# ──── Status bar (bottom, ANSI colours only) ────
# Drawn from the terminal's palette, so it follows the Omarchy theme switcher
# and shows Catppuccin wherever ghostty is set to it.
set -g status-position bottom
set -g status-justify  left
set -g status-style    "bg=default,fg=default"
set -g status-left     "#[fg=black,bg=blue,bold] #S #[default] "
set -g status-right    "#[fg=blue]#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=brightblack]#h · #[fg=magenta]%H:%M "
set -g window-status-format         "#[fg=brightblack] #I #W "
set -g window-status-current-format "#[fg=blue,bold] #I #W "
set -g pane-border-style        "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style            "bg=default,fg=blue"
set -g mode-style               "bg=blue,fg=black"

# ──── Init TPM (must be the last line) ────
run '~/.config/tmux/plugins/tpm/tpm'
