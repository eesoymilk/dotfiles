# Yazi configuration
# https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
ratio = [1, 4, 3]
sort_by = "natural"
sort_dir_first = true
show_hidden = true
linemode = "size"

# git.yazi plugin: show git status in the file list
[[plugin.prepend_fetchers]]
id = "git"
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
id = "git"
url = "*/"
run = "git"
group = "git"
